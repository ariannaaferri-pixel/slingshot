<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artemis II Around the Moon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#05080f;overflow:hidden;font-family:Inter,system-ui,sans-serif}
#wrap{position:absolute;inset:0 0 64px 0}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;--display:'Space Grotesk',Arial,sans-serif;--sans:Inter,Arial,sans-serif;--mono:'DM Mono',Consolas,monospace}
#stage { --ground:#0B1424; --main:#3FA7D6; --second:#E8EEF5; --accent:#F2A541; color:var(--second); font-family:var(--sans, system-ui, sans-serif);
  --grid:color-mix(in srgb, var(--main) 12%, transparent); --ring:color-mix(in srgb, var(--main) 30%, transparent); --dim:color-mix(in srgb, var(--second) 62%, var(--ground)); --glow:color-mix(in srgb, var(--accent) 28%, transparent); --panel:color-mix(in srgb, var(--ground) 90%, var(--main)); --edge:color-mix(in srgb, var(--main) 45%, transparent); --moon:color-mix(in srgb, var(--second) 72%, var(--ground)); --crater:color-mix(in srgb, var(--second) 50%, var(--ground)) }
.ground { position:absolute; inset:0; background:radial-gradient(80% 70% at 50% 40%, color-mix(in srgb, var(--ground) 86%, var(--main)), var(--ground)) }
.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:14px } .words > * { margin:0 }
.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:72px; line-height:1.05; font-weight:700 } .sub { font-size:32px; line-height:1.3 }
.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }
.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }
.band { position:absolute; left:50px; right:50px; bottom:36px; display:flex; gap:40px; align-items:flex-end; padding:24px 32px; border:2px solid var(--edge); border-radius:6px; background:var(--panel) }
.band .words { position:relative; flex:1; min-width:0 }
.tag { font-family:var(--mono, ui-monospace, monospace); font-size:24px; letter-spacing:.14em; color:var(--main) }
.stats { width:500px; display:flex; flex-direction:column; gap:14px }
.stat { display:flex; flex-direction:column; gap:2px } .stat .lab { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.12em; color:var(--dim) }
.stat .val { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:56px; font-weight:700; line-height:1.05; font-variant-numeric:tabular-nums; color:var(--accent); display:flex; align-items:center; gap:18px }
.chip { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.08em; padding:4px 12px; border-radius:4px; border:2px solid var(--accent); color:var(--accent); font-weight:400 }
.olab { position:absolute; width:max-content; font-family:var(--mono, ui-monospace, monospace); font-size:26px; color:var(--dim) }
.note { position:absolute; left:56px; top:40px; width:max-content; font-family:var(--mono, ui-monospace, monospace); font-size:24px; letter-spacing:.06em; color:var(--dim) }
#bar{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#0B1424;border-top:1px solid #1d3550;box-sizing:border-box}
#bar button{background:#3FA7D6;color:#0B1424;border:0;border-radius:6px;font:600 16px Inter,sans-serif;padding:9px 16px;cursor:pointer;min-width:92px}
#bar button.alt{background:transparent;color:#E8EEF5;border:1px solid #3FA7D6}
#scrub{flex:1;min-width:60px;accent-color:#F2A541}
#time{color:#E8EEF5;font:15px 'DM Mono',monospace;min-width:92px;text-align:right}
</style></head><body>
<div id="wrap"><div id="stage"></div></div>
<div id="bar"><button id="play">Pause</button><button id="again" class="alt">Replay</button><input id="scrub" type="range" min="0" max="20" step="0.01" value="0" aria-label="Timeline"><span id="time">0.0 / 20.0 s</span><button id="fs" class="alt">Full screen</button></div>
<script>
// Earth-Moon tracking map. Orion's free-return path is sampled once. Not to scale.
window.W = {
  E: { x: 330, y: 420, r: 44 }, M: { x: 1480, y: 420, r: 30 },
  SEG: 120,
  START: { launch: 0, out: 3.5, flyby: 7.5, home: 12.5, end: 16.5 },
  track() {
    if (W._pts) return W._pts;
    const pts = [], N = W.SEG;
    const cx = 218, cy = 420, rx = 150, ry = 100;
    for (let i = 0; i < N; i++) { const f = 2 * Math.PI * i / N; pts.push([cx + rx * Math.cos(f), cy - ry * Math.sin(f)]); }
    const B = [[[368, 420], [520, 270], [900, 230], [1260, 480]], [[1260, 480], [1400, 590], [1650, 580], [1680, 420]],
      [[1680, 420], [1710, 260], [1460, 250], [1260, 370]], [[1260, 370], [960, 560], [560, 620], [352, 458]]];
    B.forEach((b, k) => {
      for (let i = 0; i < N; i++) {
        const u = i / N, v = 1 - u, w0 = v * v * v, w1 = 3 * v * v * u, w2 = 3 * v * u * u, w3 = u * u * u;
        pts.push([w0 * b[0][0] + w1 * b[1][0] + w2 * b[2][0] + w3 * b[3][0], w0 * b[0][1] + w1 * b[1][1] + w2 * b[2][1] + w3 * b[3][1]]);
      }
    });
    pts.push([352, 458]);
    let mx = 0, mi = 0;
    pts.forEach((p, i) => { const d = Math.hypot(p[0] - W.E.x, p[1] - W.E.y) - W.E.r; if (d > mx) { mx = d; mi = i; } });
    W._k = 252756 / mx; W._far = mi; W._pts = pts; return pts;
  },
  at(f) {
    const p = W.track(), i = Math.max(0, Math.min(p.length - 1, f)), a = Math.floor(i), b = Math.min(p.length - 1, a + 1), u = i - a;
    return [p[a][0] + (p[b][0] - p[a][0]) * u, p[a][1] + (p[b][1] - p[a][1]) * u];
  },
  ang(f) { const a = W.at(Math.max(0, f - 1.5)), b = W.at(Math.min(600, f + 1.5)); return Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI; },
  d(f, f0) {
    const p = W.track(), n = Math.max(0, Math.min(p.length - 1, f)), s0 = Math.floor(f0 || 0);
    let s = 'M' + p[s0][0].toFixed(1) + ' ' + p[s0][1].toFixed(1);
    for (let i = s0 + 1; i <= Math.floor(n); i++) s += 'L' + p[i][0].toFixed(1) + ' ' + p[i][1].toFixed(1);
    const e = W.at(n); return s + 'L' + e[0].toFixed(1) + ' ' + e[1].toFixed(1);
  },
  miles(f) { W.track(); const p = W.at(f); return Math.max(0, Math.round((Math.hypot(p[0] - W.E.x, p[1] - W.E.y) - W.E.r) * W._k)); },
  day(f) { const K = [[0, 1], [120, 2], [360, 6], [600, 10]]; for (let i = 0; i < 3; i++) if (f <= K[i + 1][0]) return K[i][1] + (K[i + 1][1] - K[i][1]) * (f - K[i][0]) / (K[i + 1][0] - K[i][0]); return 10; },
  fmt(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); },
  cam(el, gt) { el.style.transformOrigin = '960px 420px'; el.style.transform = 'scale(' + (1 + 0.04 * Math.min(1, gt / 20)).toFixed(4) + ')'; },
  grid(id) {
    let s = '<defs><pattern id="' + id + '" width="60" height="60" patternUnits="userSpaceOnUse" y="0"><path d="M60 0H0V60" style="fill:none;stroke:var(--grid);stroke-width:1.5"/></pattern></defs>';
    s += '<g class="trk-grid"><rect x="-200" y="-200" width="2320" height="1480" fill="url(#' + id + ')"/>';
    s += '<path d="M' + W.E.x + ' ' + W.E.y + 'H' + W.M.x + '" style="fill:none;stroke:var(--ring);stroke-width:2;stroke-dasharray:6 12"/>';
    for (let x = W.E.x + 115; x < W.M.x; x += 115) s += '<path d="M' + x + ' ' + (W.E.y - 8) + 'V' + (W.E.y + 8) + '" style="stroke:var(--ring);stroke-width:2"/>';
    return s + '</g>';
  },
  earth(cls) {
    const E = W.E;
    return '<g class="' + cls + '" transform="translate(' + E.x + ' ' + E.y + ')"><circle r="' + (E.r + 10) + '" style="fill:color-mix(in srgb, var(--main) 18%, transparent)"/><circle r="' + E.r + '" style="fill:var(--main)"/>' +
      '<path d="M-30 -14 q12 -14 26 -8 q8 10 -4 18 q-14 4 -22 -10 Z M6 6 q16 -6 24 6 q-4 18 -18 20 q-10 -10 -6 -26 Z" style="fill:color-mix(in srgb, var(--main) 55%, var(--ground))"/>' +
      '<circle r="' + E.r + '" style="fill:none;stroke:color-mix(in srgb, var(--second) 40%, transparent);stroke-width:3"/><path d="M-' + (E.r - 6) + ' -10 A' + (E.r - 6) + ' ' + (E.r - 6) + ' 0 0 1 -10 -' + (E.r - 6) + '" style="fill:none;stroke:color-mix(in srgb, var(--second) 55%, transparent);stroke-width:5;stroke-linecap:round"/></g>';
  },
  moon(cls) {
    const M = W.M;
    return '<g class="' + cls + '" transform="translate(' + M.x + ' ' + M.y + ')"><circle r="' + (M.r + 8) + '" style="fill:color-mix(in srgb, var(--second) 10%, transparent)"/><circle r="' + M.r + '" style="fill:var(--moon)"/>' +
      '<circle cx="-10" cy="-8" r="7" style="fill:var(--crater)"/><circle cx="9" cy="6" r="9" style="fill:var(--crater)"/><circle cx="-6" cy="15" r="4" style="fill:var(--crater)"/></g>';
  },
  // Orion: service module, crew capsule pointing forward (+x), and four small solar wings
  orion(cls) {
    return '<g class="' + cls + '"><circle r="26" style="fill:var(--glow)"/><path d="M-12 -6 L-30 -22 L-26 -24 L-8 -8 Z M-12 6 L-30 22 L-26 24 L-8 8 Z" style="fill:var(--main)"/>' +
      '<rect x="-18" y="-7" width="16" height="14" rx="2" style="fill:var(--dim)"/><path d="M-2 -8 L14 -3 L14 3 L-2 8 Z" style="fill:var(--second)"/></g>';
  },
  // burn plume behind the craft (points along -x)
  plume(cls) { return '<path class="' + cls + '" d="M-18 -5 L-60 0 L-18 5 Z" style="fill:var(--accent)"/>'; },
  labels(prefix) {
    return '<div class="olab ' + prefix + '-le" style="left:' + (W.E.x - 36) + 'px;top:' + (W.E.y + 66) + 'px">Earth</div>' +
      '<div class="olab ' + prefix + '-lm" style="left:' + (W.M.x - 118) + 'px;top:' + (W.M.y - 16) + 'px">Moon</div>';
  },
};

const clamp=v=>Math.max(0,Math.min(1,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a)), lerp=(a,b,u)=>a+(b-a)*u;
const eo=u=>1-Math.pow(1-u,3), ei=u=>u*u*u, eio=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const stage=document.getElementById('stage');
stage.innerHTML='<div class="ground"><div class="s-cam" style="position:absolute;inset:0"><svg class="art" viewBox="0 0 1920 1080">'+W.grid('s-gp')+W.earth('s-earth')+W.moon('s-moon')+
 '<path class="s-glow" style="fill:none;stroke:var(--glow);stroke-width:16;stroke-linecap:round;stroke-linejoin:round"/>'+
 '<path class="s-trail" style="fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round"/>'+
 '<circle class="s-ping" r="20" style="fill:none;stroke:var(--accent);stroke-width:3;opacity:0"/>'+
 '<g class="s-pos"><g class="s-rot">'+W.plume('s-plume')+W.orion('s-orion')+'</g></g></svg>'+W.labels('s')+'</div>'+
 '<div class="band"><div class="words"><div class="tag s-tag"></div><h2 class="line s-line"></h2><p class="sub s-sub"></p></div>'+
 '<div class="stats"><div class="stat"><div class="lab">DATE</div><div class="val s-date">April 1</div></div>'+
 '<div class="stat"><div class="lab">MILES FROM EARTH</div><div class="val"><span class="s-mi">0</span><span class="chip s-chip">RECORD</span></div></div></div></div>'+
 '<div class="note">Diagram not to scale</div></div>';
const q=s=>stage.querySelector('.s-'+s);
const r={cam:q('cam'),glow:q('glow'),trail:q('trail'),ping:q('ping'),pos:q('pos'),rot:q('rot'),plume:q('plume'),tag:q('tag'),line:q('line'),sub:q('sub'),date:q('date'),mi:q('mi'),chip:q('chip')};
function update(f,gt){W.cam(r.cam,gt);const d=W.d(f,0);r.trail.setAttribute('d',d);r.glow.setAttribute('d',d);const p=W.at(f);
 r.pos.setAttribute('transform','translate('+p[0].toFixed(1)+' '+p[1].toFixed(1)+')');r.rot.setAttribute('transform','rotate('+W.ang(f).toFixed(1)+')');
 r.date.textContent='April '+Math.min(10,Math.floor(W.day(f)+0.001));r.mi.textContent=W.fmt(W.miles(f));W.track();r.chip.style.opacity=f>=W._far-0.5?1:0;}
function words(t,lineAt,subAt){const a=eo(seg(t,lineAt,lineAt+0.6));r.line.style.opacity=a;r.line.style.transform='translateX('+lerp(40,0,a).toFixed(1)+'px)';
 const b=eo(seg(t,subAt,subAt+0.5));r.sub.style.opacity=b;r.sub.style.transform='translateX('+lerp(28,0,b).toFixed(1)+'px)';}
function ping(x,y,rad,op){r.ping.setAttribute('cx',x.toFixed(1));r.ping.setAttribute('cy',y.toFixed(1));r.ping.setAttribute('r',rad.toFixed(1));r.ping.style.opacity=op;}
const SC=[
 {dur:3.5,tag:'NASA · ARTEMIS II',line:'Around the Moon and back',sub:'April 1, 2026: four astronauts launch.',
  render(t){update(lerp(0,120,seg(t,0.4,3.5)),t);words(t,0,0.9);}},
 {dur:4,tag:'TRANS-LUNAR INJECTION',line:'One push toward the Moon',sub:'April 2: a single 6-minute engine burn.',
  render(t){update(120+120*eo(seg(t,0.3,4.0)),3.5+t);const burn=seg(t,0,0.3)*(1-seg(t,0.9,1.3));r.plume.style.opacity=burn;
   r.plume.setAttribute('transform','scale('+(0.8+0.25*burn+0.06*Math.sin(t*9)).toFixed(3)+' 1)');words(t,0.1,0.8);}},
 {dur:5,tag:'LUNAR FLYBY',line:'The Moon’s gravity bends the path',sub:'April 6: 4,067 miles above the Moon’s far side.',
  render(t){const tFar=0.3+4.6*0.5,f=240+240*eio(seg(t,0.3,4.9));update(f,7.5+t);W.track();const p=W.at(W._far),u=seg(t,tFar-0.1,tFar+1.0);
   ping(p[0],p[1],20+70*eo(u),u>0&&u<1?(1-u):0);
   r.chip.style.transform='scale('+(f>=W._far-0.5?lerp(1.25,1,eo(seg(t,tFar,tFar+0.5))):1).toFixed(3)+')';words(t,0.1,0.9);}},
 {dur:4,tag:'RETURN',line:'Gravity pulls it home',sub:'April 10: splashdown in the Pacific Ocean.',
  render(t){update(480+120*ei(seg(t,0,3.4)),12.5+t);r.chip.style.opacity=1-eo(seg(t,0,0.4));const p=W.at(600),u=seg(t,3.4,4.4);
   ping(p[0],p[1],20+60*eo(u),u>0&&u<1?(1-u):0);r.pos.style.opacity=1-eo(seg(t,3.3,3.8));words(t,0.1,0.8);}},
 {dur:3.5,tag:'FREE-RETURN PATH',line:'The Moon turned Orion around',sub:'No big engine burn was needed to come home.',
  render(t){update(600,16.5+t);r.pos.style.opacity=0;r.date.textContent='April 10';r.mi.textContent='252,756';r.chip.style.opacity=1;
   r.trail.style.opacity=(0.85+0.15*Math.sin(t*2)).toFixed(3);W.track();const m=W.at(W._far),u=(t%1.8)/1.8;
   ping(m[0],m[1],20+50*eo(u),((1-u)*0.7).toFixed(3));words(t,0,0.8);}}];
const TOTAL=20;
function draw(T){let t=Math.min(T,TOTAL-0.001),s0=0;for(const s of SC){if(t<s0+s.dur){
  r.tag.textContent=s.tag;r.line.textContent=s.line;r.sub.textContent=s.sub;
  r.plume.style.opacity=0;r.pos.style.opacity=1;r.ping.style.opacity=0;r.trail.style.opacity=r.glow.style.opacity=0.9;r.chip.style.transform='';
  s.render(t-s0);return;}s0+=s.dur;}}
function fit(){const w=document.getElementById('wrap'),k=Math.min(w.clientWidth/1920,w.clientHeight/1080);
 stage.style.transform='translate('+((w.clientWidth-1920*k)/2)+'px,'+((w.clientHeight-1080*k)/2)+'px) scale('+k+')';}
addEventListener('resize',fit);fit();
let T=0,playing=true,last=performance.now();
const pb=document.getElementById('play'),sc=document.getElementById('scrub'),tm=document.getElementById('time');
function setPlay(p){playing=p;pb.textContent=p?'Pause':'Play';last=performance.now();}
pb.onclick=()=>{if(!playing&&T>=TOTAL)T=0;setPlay(!playing);};
document.getElementById('again').onclick=()=>{T=0;setPlay(true);};
sc.oninput=()=>{T=+sc.value;setPlay(false);};
document.getElementById('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pb.click();}});
function loop(now){if(playing){T+=(now-last)/1000;if(T>=TOTAL){T=TOTAL;setPlay(false);}}last=now;draw(T);sc.value=T;tm.textContent=T.toFixed(1)+' / 20.0 s';requestAnimationFrame(loop);}
draw(0);requestAnimationFrame(loop);
</script></body></html>
