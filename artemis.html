<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artemis II Around the Moon</title>
<style>
html,body{margin:0;height:100%;background:#070c18;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#E8EEF5}
#c{position:absolute;left:0;top:0;width:100%;height:calc(100% - 64px);display:block}
#bar{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#0B1424;border-top:1px solid #1d3550;box-sizing:border-box}
#bar button{background:#3FA7D6;color:#0B1424;border:0;border-radius:6px;font:bold 15px Arial,sans-serif;padding:9px 14px;cursor:pointer;min-width:84px}
#bar button.alt{background:transparent;color:#E8EEF5;border:1px solid #3FA7D6}
#scrub{flex:1;min-width:60px;accent-color:#F2A541}
#time{font:14px monospace;min-width:84px;text-align:right}
</style></head><body>
<canvas id="c"></canvas>
<div id="bar"><button id="play">Pause</button><button id="again" class="alt">Replay</button><button id="lab" class="alt">Labels: On</button><input id="scrub" type="range" min="0" max="38" step="0.01" value="0" aria-label="Timeline"><span id="time">0.0 s</span><button id="fs" class="alt">Full screen</button></div>
<script>
// ---------- path (same shape as the worksheet map) ----------
const SX=0.6, E={x:330*SX,y:420}, MO={x:1480*SX,y:420}, ER=44*SX*1.15, MR=30*SX*1.2;
function bez(b,n){const o=[];for(let i=0;i<=n;i++){const u=i/n,a=(1-u)**3,c=3*(1-u)**2*u,d=3*(1-u)*u*u,e=u**3;o.push({x:(a*b[0][0]+c*b[1][0]+d*b[2][0]+e*b[3][0])*SX,y:a*b[0][1]+c*b[1][1]+d*b[2][1]+e*b[3][1]});}return o;}
const P=[],idx={};
// launch: from Earth's surface up to the parking orbit
const f0=Math.acos((300-218)/150);
const lpA={x:300*SX,y:385}, lpB={x:(218+150*Math.cos(f0))*SX,y:420-100*Math.sin(f0)};
for(let i=0;i<=30;i++){const u=i/30;P.push({x:lpA.x+(lpB.x-lpA.x)*u,y:lpA.y+(lpB.y-lpA.y)*u});}
idx.launchEnd=P.length-1;
// one orbit around Earth (counterclockwise on screen), ending at the departure point
for(let i=1;i<=260;i++){const f=f0+(2*Math.PI-f0)*i/260;P.push({x:(218+150*Math.cos(f))*SX,y:420-100*Math.sin(f)});}
idx.tli=P.length-1;
const B=[[[368,420],[520,270],[900,230],[1260,480]],[[1260,480],[1400,590],[1650,580],[1680,420]],[[1680,420],[1710,260],[1460,250],[1260,370]],[[1260,370],[960,560],[560,620],[352,458]]];
B.forEach((b,k)=>{const s=bez(b,k==0||k==3?260:140);s.shift();s.forEach(q=>P.push(q));if(k==0)idx.out=P.length-1;if(k==2)idx.flyEnd=P.length-1;});
idx.end=P.length-1;
// cumulative length
const L=[0];for(let i=1;i<P.length;i++)L.push(L[i-1]+Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y));
const sAt=i=>L[i];
function posAt(s){let lo=0,hi=L.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(L[m]<s)lo=m;else hi=m;}const t=(s-L[lo])/((L[hi]-L[lo])||1);return{x:P[lo].x+(P[hi].x-P[lo].x)*t,y:P[lo].y+(P[hi].y-P[lo].y)*t,a:Math.atan2(P[hi].y-P[lo].y,P[hi].x-P[lo].x),i:lo};}
// farthest point from Earth (for the record + miles scale)
let far=0,farI=0;P.forEach((q,i)=>{const d=Math.hypot(q.x-E.x,q.y-E.y);if(d>far){far=d;farI=i;}});
const MILES=d=>Math.max(0,Math.round((d-ER)/(far-ER)*252756));
// box points from the worksheet map
const BOX=[[300,385],[68,420],[370,430],[1690,420],[900,null],[352,465]].map((b,k)=>{
  if(k==4){let best=null,bd=1e9;for(let i=idx.flyEnd;i<=idx.end;i++){const d=Math.abs(P[i].x-900*SX);if(d<bd){bd=d;best=P[i];}}return{x:best.x,y:best.y};}
  return{x:b[0]*SX,y:b[1]};});
// ---------- timeline: [t0,t1, s0,s1, ease] ----------
const ease={lin:u=>u,out:u=>1-Math.pow(1-u,2.2),in:u=>Math.pow(u,2.2),io:u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2};
const sFly0=sAt(Math.round(idx.out+(idx.flyEnd-idx.out)*0.05)), sFly1=sAt(idx.flyEnd);
const K=[
 [0,3,0,0,'lin'],
 [3,5.5,0,sAt(idx.launchEnd),'in'],
 [5.5,10.5,sAt(idx.launchEnd),sAt(idx.tli),'lin'],
 [10.5,12.5,sAt(idx.tli),sAt(idx.tli)+30,'in'],
 [12.5,32.5,sAt(idx.tli)+30,sAt(idx.end)-6,'coast'],
 [32.5,33.6,sAt(idx.end)-6,sAt(idx.end),'out'],
 [33.6,38,sAt(idx.end),sAt(idx.end),'lin']];
const TOTAL=38;
// coasting speed profile: slows on the way out, small boost near the Moon, speeds up all the way home
const g=t=>0.22+0.8*Math.exp(-(t-12.5)/2.6)+0.18*Math.exp(-Math.pow((t-22.5)/1.8,2))+(t>23.5?1.15*Math.pow((t-23.5)/9,2):0);
const CT=[0];{let acc=0;for(let t=12.5;t<32.5;t+=0.01){acc+=g(t)*0.01;CT.push(acc);}}
const cS0=sAt(idx.tli)+30,cS1=sAt(idx.end)-6;
function coast(t){const i=Math.min(CT.length-1,Math.max(0,Math.round((t-12.5)/0.01)));return cS0+(cS1-cS0)*CT[i]/CT[CT.length-1];}
function sOf(t){for(const k of K){if(t<=k[1]){if(k[4]=='coast')return coast(t);const u=Math.max(0,Math.min(1,(t-k[0])/(k[1]-k[0])));return k[2]+(k[3]-k[2])*ease[k[4]](u);}}return L[L.length-1];}
function tWhen(sv){for(let t=12.5;t<32.5;t+=0.01)if(coast(t)>=sv)return t;return 32.5;}
const tF0=tWhen(sFly0),tF1=tWhen(sFly1);
// calendar: April 1 launch, April 2 burn, April 6 flyby, April 10 splashdown
function dayOf(t){const pts=[[0,1],[5.5,1],[10.5,2],[(tF0+tF1)/2,6],[33.6,10]];if(t>=33.6)return 10;for(let i=1;i<pts.length;i++)if(t<=pts[i][0]){const a=pts[i-1],b=pts[i];return Math.floor(a[1]+(b[1]-a[1])*(t-a[0])/(b[0]-a[0]));}return 10;}
// captions (box number + event), matching the worksheet events in order
const CAP=[
 [0,3,null,'Artemis II: Around the Moon and Back','Follow Orion, the spacecraft carrying four astronauts.'],
 [3,5.5,1,'Launch','Orion launches from Florida on April 1, 2026.'],
 [5.5,10.5,2,'Checkout orbit','Orion orbits Earth for about a day while the crew checks the spacecraft.'],
 [10.5,12.5,3,'Engine burn','Orion fires its engine for about 6 minutes, aimed at the Moon.'],
 [12.5,tF0,null,'Coasting out','No more engine. Earth’s gravity pulls back, so Orion slows down.'],
 [tF0,tF1,4,'Around the far side','4,067 miles above the Moon. The Moon’s gravity bends the path around.'],
 [tF1,32.5,5,'Falling home','No big engine burn. Earth’s gravity pulls Orion back and it speeds up.'],
 [32.5,38,6,'Splashdown','Orion splashes down in the Pacific Ocean on April 10.']];
// ---------- drawing ----------
const cv=document.getElementById('c'),cx=cv.getContext('2d');let W=0,H=0,dpr=1,sc=1,ox=0,oy=0;
const WB=(()=>{let a=1e9,b=-1e9,c=1e9,d=-1e9;P.forEach(q=>{a=Math.min(a,q.x);b=Math.max(b,q.x);c=Math.min(c,q.y);d=Math.max(d,q.y);});return{x0:a-40,x1:b+40,y0:c-40,y1:d+50};})();
function fit(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
 const top=70,bot=110;sc=Math.min(W/(WB.x1-WB.x0),(H-top-bot)/(WB.y1-WB.y0));ox=(W-(WB.x1-WB.x0)*sc)/2-WB.x0*sc;oy=top+((H-top-bot)-(WB.y1-WB.y0)*sc)/2-WB.y0*sc;}
addEventListener('resize',fit);
const X=x=>ox+x*sc,Y=y=>oy+y*sc;
const stars=[...Array(160)].map(()=>[Math.random(),Math.random(),Math.random()*1.3+0.3]);
let labels=true;
function draw(t){
 const s=sOf(t),p=posAt(s),s2=sOf(Math.min(TOTAL,t+0.05)),spd=Math.abs(s2-s)/0.05;
 cx.fillStyle='#070c18';cx.fillRect(0,0,W,H);
 stars.forEach(st=>{cx.fillStyle='rgba(255,255,255,'+(0.25+st[2]*0.3)+')';cx.fillRect(st[0]*W,st[1]*H,st[2],st[2]);});
 // full route (dashed, like the worksheet map)
 cx.setLineDash([6,6]);cx.strokeStyle='rgba(120,160,200,0.35)';cx.lineWidth=1.5;cx.beginPath();P.forEach((q,i)=>i?cx.lineTo(X(q.x),Y(q.y)):cx.moveTo(X(q.x),Y(q.y)));cx.stroke();cx.setLineDash([]);
 // trail so far
 cx.strokeStyle='#F2A541';cx.lineWidth=3.5;cx.lineCap='round';cx.beginPath();
 for(let i=0;i<=p.i;i++){const q=P[i];i?cx.lineTo(X(q.x),Y(q.y)):cx.moveTo(X(q.x),Y(q.y));}cx.lineTo(X(p.x),Y(p.y));cx.stroke();
 // Earth and Moon
 cx.fillStyle='#2f7fd1';cx.beginPath();cx.arc(X(E.x),Y(E.y),ER*sc,0,7);cx.fill();
 cx.fillStyle='#4fae6a';cx.beginPath();cx.ellipse(X(E.x)-ER*sc*0.25,Y(E.y)-ER*sc*0.15,ER*sc*0.35,ER*sc*0.22,0.5,0,7);cx.fill();
 cx.fillStyle='#cfd3da';cx.beginPath();cx.arc(X(MO.x),Y(MO.y),MR*sc,0,7);cx.fill();
 cx.fillStyle='#E8EEF5';cx.font='bold '+Math.max(12,14*sc)+'px Arial';cx.textAlign='center';
 cx.fillText('Earth',X(E.x),Y(E.y)+ER*sc+18*sc+6);cx.fillText('Moon',X(MO.x),Y(MO.y)+MR*sc+18*sc+6);
 // signal check: is the Moon between Earth and Orion?
 const dx=p.x-E.x,dy=p.y-E.y,len=Math.hypot(dx,dy),u=((MO.x-E.x)*dx+(MO.y-E.y)*dy)/(len*len);
 const cxp=E.x+dx*u,cyp=E.y+dy*u,blocked=u>0&&u<1&&Math.hypot(MO.x-cxp,MO.y-cyp)<MR*2.0&&t>12;
 // radio line
 if(t>3&&t<33.6){cx.setLineDash([2,6]);cx.strokeStyle=blocked?'rgba(255,90,90,0.8)':'rgba(63,167,214,0.55)';cx.lineWidth=1.2;cx.beginPath();cx.moveTo(X(E.x),Y(E.y));cx.lineTo(X(p.x),Y(p.y));cx.stroke();cx.setLineDash([]);}
 // numbered markers (same numbers as the worksheet boxes)
 if(labels){CAP.forEach(c=>{if(c[2]==null)return;const b=BOX[c[2]-1],on=t>=c[0];
   cx.fillStyle=on?'#F2A541':'rgba(255,255,255,0.15)';cx.beginPath();cx.arc(X(b.x),Y(b.y),11,0,7);cx.fill();
   cx.fillStyle=on?'#0B1424':'rgba(255,255,255,0.5)';cx.font='bold 13px Arial';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(c[2],X(b.x),Y(b.y)+0.5);cx.textBaseline='alphabetic';});}
 // engine plume
 const burn=t>=10.5&&t<12.5;
 cx.save();cx.translate(X(p.x),Y(p.y));cx.rotate(p.a);
 if(burn||t<5.5&&t>=3){cx.fillStyle='rgba(255,170,60,'+(0.7+0.3*Math.sin(t*40))+')';cx.beginPath();cx.moveTo(-8,-5);cx.lineTo(-26-6*Math.sin(t*30),0);cx.lineTo(-8,5);cx.fill();}
 if(t<33.6||t>=33.6&&t<34.2){cx.fillStyle='#ffffff';cx.beginPath();cx.moveTo(10,0);cx.lineTo(-8,-6);cx.lineTo(-5,0);cx.lineTo(-8,6);cx.closePath();cx.fill();}
 cx.restore();
 if(t>=33.6){const k=(t-33.6);cx.strokeStyle='rgba(120,200,255,'+Math.max(0,1-k/2)+')';cx.lineWidth=2;cx.beginPath();cx.arc(X(p.x),Y(p.y),8+k*18,0,7);cx.stroke();}
 // ---- telemetry panel ----
 const mi=MILES(Math.hypot(p.x-E.x,p.y-E.y)),miles=t<12.5||mi<2000?'Near Earth':mi.toLocaleString(),rec=s>=sAt(farI);
 cx.textAlign='left';cx.fillStyle='rgba(11,20,36,0.85)';cx.fillRect(14,12,W-28,52);
 cx.font='12px monospace';cx.fillStyle='#8fb3d1';
 const cols=[['DATE',W*0.03],['MILES FROM EARTH',W*0.2],['SPEED',W*0.45],['RADIO',W*0.75]];cols.forEach(c=>cx.fillText(c[0],14+c[1],30));
 cx.font='bold 20px Arial';cx.fillStyle='#E8EEF5';
 cx.fillText('April '+dayOf(t),14+cols[0][1],55);
 cx.fillText(miles,14+cols[1][1],55);
 if(rec){const w=cx.measureText(miles).width;cx.fillStyle='#F2A541';cx.font='bold 12px Arial';cx.fillText('RECORD SET: 252,756 mi',14+cols[1][1]+w+10,52);}
 // speed bar
 const sMax=sc0max; const fr=Math.min(1,spd/sMax), bx=14+cols[2][1],bw=W*0.22;
 cx.fillStyle='rgba(255,255,255,0.12)';cx.fillRect(bx,42,bw,12);cx.fillStyle='#3FA7D6';cx.fillRect(bx,42,bw*fr,12);
 const trend=t>=12.5&&t<tF0?'slowing down':t>=tF1&&t<33.6?'speeding up':'';
 if(trend){cx.font='bold 12px Arial';cx.fillStyle=trend[1]=='l'?'#ff9a9a':'#9affc0';cx.fillText(trend,bx+bw+8,53);}
 cx.font='bold 18px Arial';cx.fillStyle=blocked?'#ff6b6b':'#9affc0';cx.fillText(t<3?'—':blocked?'SIGNAL LOST':'CONNECTED',14+cols[3][1],55);
 // ---- caption band ----
 const c=CAP.find(c=>t>=c[0]&&t<c[1])||CAP[CAP.length-1];
 cx.fillStyle='rgba(11,20,36,0.85)';cx.fillRect(14,H-96,W-28,82);
 if(labels){cx.fillStyle='#F2A541';cx.font='bold 13px Arial';cx.fillText(c[2]?('BOX '+c[2]):'',30,H-70);
  cx.fillStyle='#E8EEF5';cx.font='bold '+Math.min(28,Math.max(18,W/50))+'px Arial';cx.fillText(c[3],c[2]?96:30,H-68);
  cx.fillStyle='#c9d6e3';cx.font=Math.min(19,Math.max(14,W/75))+'px Arial';cx.fillText(c[4],30,H-36);}
 else{cx.fillStyle='#8fb3d1';cx.font='16px Arial';cx.fillText('Labels are off. Watch the path, the speed, and the radio.',30,H-50);}
 if(blocked&&labels){cx.fillStyle='#ff9a9a';cx.font='bold 14px Arial';cx.textAlign='right';cx.fillText('The Moon is blocking radio signals from Earth',W-30,H-70);cx.textAlign='left';}
 cx.fillStyle='rgba(232,238,245,0.6)';cx.font='italic 12px Arial';cx.textAlign='right';cx.fillText('Not to scale',W-22,H-104);cx.textAlign='left';
}
// max speed for the bar
let sc0max=0;for(let t=0;t<TOTAL-0.1;t+=0.05){const v=Math.abs(sOf(t+0.05)-sOf(t))/0.05;if(t>12.5&&v>sc0max)sc0max=v;}
// ---------- controls ----------
fit();let T=0,playing=true,last=performance.now();
const pb=document.getElementById('play'),sr=document.getElementById('scrub'),tm=document.getElementById('time'),lb=document.getElementById('lab');
function setPlay(v){playing=v;pb.textContent=v?'Pause':'Play';last=performance.now();}
pb.onclick=()=>{if(!playing&&T>=TOTAL)T=0;setPlay(!playing);};
document.getElementById('again').onclick=()=>{T=0;setPlay(true);};
lb.onclick=()=>{labels=!labels;lb.textContent='Labels: '+(labels?'On':'Off');};
sr.oninput=()=>{T=+sr.value;setPlay(false);};
document.getElementById('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pb.click();}});
function loop(now){if(playing){T+=(now-last)/1000;if(T>=TOTAL){T=TOTAL;setPlay(false);}}last=now;draw(Math.min(T,TOTAL-0.001));sr.value=T;tm.textContent=T.toFixed(1)+' s';requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
