let sc0max=0;for(let t=0;t<TOTAL-0.1;t+=0.05){const v=Math.abs(sOf(t+0.05)-sOf(t))/0.05;if(t>TB0&&v>sc0max)sc0max=v;}
// ---------- controls ----------
fit();let T=0,playing=true,last=performance.now();
const pb=document.getElementById('play'),sr=document.getElementById('scrub'),tm=document.getElementById('time'),lb=document.getElementById('lab');
function setPlay(v){playing=v;pb.textContent=v?'Pause':'Play';last=performance.now();}
pb.onclick=()=>{if(!playing&&T>=TOTAL)T=0;setPlay(!playing);};
document.getElementById('again').onclick=()=>{T=0;setPlay(true);};
lb.onclick=()=>{labels=!labels;lb.textContent='Labels: '+(labels?'On':'Off');};
sr.oninput=()=>{T=+sr.value;setPlay(false);};
document.getElementById('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pb.click();}});
const phEl=document.getElementById('photo'),bigEl=document.getElementById('big');let phNow=-1;
function showPhoto(t){const i=PH.findIndex(ph=>t>=ph.a&&t<ph.b);if(i===phNow)return;phNow=i;
 if(i<0){phEl.classList.remove('on');return;}const ph=PH[i],im=phEl.querySelector('img');
 let tries=0;im.style.display='';im.onerror=()=>{const alt=['~medium.jpg','~orig.jpg'];if(tries<alt.length){im.src=NI(ph.id).replace('~large.jpg',alt[tries++]);return;}im.style.display='none';phEl.querySelector('.cap').textContent=ph.c+' (Photo did not load. Search \u201c'+ph.id+'\u201d at images.nasa.gov.)';};im.src=NI(ph.id);im.alt=ph.t;
 phEl.querySelector('h3').textContent=ph.t;phEl.querySelector('.cap').textContent=ph.c;phEl.querySelector('.cr').textContent='NASA photo '+ph.id+' \u00b7 click to enlarge';phEl.classList.add('on');}
phEl.onclick=()=>{if(phNow<0)return;const ph=PH[phNow];bigEl.querySelector('img').src=phEl.querySelector('img').src;bigEl.querySelector('img').alt=ph.t;bigEl.querySelector('p').textContent=ph.t+': '+ph.c+' (NASA)';bigEl.classList.add('on');setPlay(false);};
bigEl.onclick=()=>{bigEl.classList.remove('on');};
function loop(now){showPhoto(Math.min(T,TOTAL-0.001));if(playing){const ph=PH.find(ph=>T>=ph.a&&T<ph.b);T+=(now-last)/1000*(ph?(ph.b-ph.a)/6.5:1);if(T>=TOTAL){T=TOTAL;setPlay(false);}}last=now;draw(Math.min(T,TOTAL-0.001));sr.value=T;tm.textContent=T.toFixed(1)+' s';requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
