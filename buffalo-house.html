<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design a Buffalo House Model</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@400;700&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }

/* Layout: one 16:9 model stage, scaled to fit, with a step bar under it. */
:root {
  --page: #EEF2FB; --card: #FFFFFF; --ink: #1A2233; --muted: #55607A; --royal: #1F4FD8; --royal-ink: #FFFFFF; --line: #C9D3EA; --track: #DCE3F4;
  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --font-head: 'Outfit', 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #0F1626; --card: #172036; --ink: #E8EDF8; --muted: #A4AEC6; --royal: #5B82F0; --royal-ink: #0B1220; --line: #2C3A5C; --track: #26324E; color-scheme: dark } }
:root[data-theme="dark"] { --page: #0F1626; --card: #172036; --ink: #E8EDF8; --muted: #A4AEC6; --royal: #5B82F0; --royal-ink: #0B1220; --line: #2C3A5C; --track: #26324E; color-scheme: dark }
html, body { background: var(--page); color: var(--ink); }
body { font-family: var(--font-ui); font-size: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 24px; }
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
.top h1 { font-family: var(--font-head); font-size: clamp(22px, 3vw, 30px); margin: 0; text-wrap: balance; }
.top p { margin: 0; color: var(--muted); font-size: 15px; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); background: #F5F8FF; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
  --sans: 'Inter', system-ui, sans-serif; --display: 'Outfit', 'Inter', system-ui, sans-serif; }
#stage .scene { position: absolute; inset: 0; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.count { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 9.5em; }
.track { flex: 1 1 160px; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; min-width: 0; }
.fill { height: 100%; width: 0; background: var(--royal); border-radius: 4px; transition: width .25s ease; }
.btns { display: flex; gap: 8px; margin-left: auto; }
button { font: inherit; font-weight: 700; font-size: 16px; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 2px solid var(--royal); background: var(--card); color: var(--royal); }
button.primary { background: var(--royal); color: var(--royal-ink); padding-inline: 28px; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible { outline: 3px solid var(--royal); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
@media (max-width: 560px) { .btns { width: 100%; } .btns button { flex: 1; padding-inline: 8px; } .count { min-width: 0; } }
#stage { --ground:#F5F8FF; --main:#1F4FD8; --second:#1A2233; --accent:#F2B630; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }
.ground { position:absolute; inset:0; background:var(--ground) }
.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:20px } .words > * { margin:0 }
.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:60px; line-height:1.08; font-weight:700 } .sub { font-size:34px; line-height:1.35 }
#stage { --pencil:color-mix(in srgb, var(--second) 62%, var(--ground)); --green:color-mix(in oklch decreasing hue, var(--main) 50%, var(--accent)); --gridm:color-mix(in srgb, var(--main) 11%, var(--ground)); --gridM:color-mix(in srgb, var(--main) 24%, var(--ground)); --wallc:color-mix(in srgb, var(--accent) 12%, var(--ground)); --siding:color-mix(in srgb, var(--second) 9%, var(--wallc)); --roof:color-mix(in srgb, var(--second) 58%, var(--ground)); --roofL:color-mix(in srgb, var(--second) 36%, var(--ground)); --glass:color-mix(in srgb, var(--main) 14%, var(--ground)); --grass:color-mix(in srgb, var(--green) 30%, var(--ground)); --grassD:color-mix(in srgb, var(--green) 75%, var(--second)); --panel:color-mix(in srgb, var(--main) 6%, var(--ground)); --sunE:color-mix(in srgb, var(--accent) 70%, var(--second)); --shadeW:color-mix(in srgb, var(--second) 34%, transparent); --sunW:color-mix(in srgb, var(--accent) 85%, transparent) }
.dg-clip { position:absolute; left:0; top:0; width:1240px; height:1080px; overflow:hidden }
.dg { position:absolute; left:0; top:0; width:1240px; height:1080px; transform-origin:0 0 }
.dg-svg { position:absolute; left:0; top:0; overflow:visible }
.lab { position:absolute; font-size:calc(28px * var(--k, 1)); line-height:1.15; padding:calc(2px * var(--k, 1)) calc(7px * var(--k, 1)); border-radius:calc(6px * var(--k, 1)); background:color-mix(in srgb, var(--ground) 88%, transparent); color:var(--second); width:max-content; margin:0 }
.lab.c { transform:translate(-50%, -50%) } .lab.l { transform:translate(0, -50%) } .lab.r { transform:translate(-100%, -50%) }
.tag { font-weight:700; border:calc(3px * var(--k, 1)) solid var(--pencil); background:var(--ground) }
.tag-blue { border-color:var(--main); color:var(--main) } .tag-green { border-color:var(--green) } .tag-sun { border-color:var(--accent) }
.pn { position:absolute; left:1240px; top:0; width:680px; height:1080px; background:var(--panel); border-left:3px solid color-mix(in srgb, var(--main) 28%, var(--ground)) }
.pn-w { left:60px; top:120px; width:560px }
.pn-eye { display:flex; align-items:center; gap:14px; font-size:28px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--main) }
.pn-chip { width:46px; height:12px; border-radius:6px; flex:none }
.pn-pencil { background:var(--pencil) } .pn-blue { background:var(--main) } .pn-green { background:var(--green) } .pn-sun { background:var(--accent) }
.pn-h { font-size:62px; color:var(--second) }
.pn-steps { display:grid; margin-top:10px } .pn-steps > * { grid-area:1 / 1 }
.pn-s { font-size:36px; line-height:1.4; color:var(--second); margin:0 }
.pn-key { position:absolute; left:60px; bottom:44px; width:560px; display:flex; flex-direction:column; gap:10px; padding:18px 22px; border-radius:14px; background:var(--ground); border:2px solid color-mix(in srgb, var(--main) 25%, var(--ground)) }
.pn-key-h { margin:0; font-size:24px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--main) }
.pn-key-i { margin:0; display:flex; align-items:center; gap:16px; font-size:27px; line-height:1.25; color:var(--second) } .pn-key-sw { flex:none; width:52px; height:10px; border-radius:5px }
.pn-list { display:flex; flex-direction:column; gap:22px; margin-top:10px } .pn-li { font-size:34px; line-height:1.35; margin:0; display:flex; gap:18px } .pn-n { flex:none; width:52px; height:52px; border-radius:50%; background:var(--main); color:var(--ground); font-weight:700; display:flex; align-items:center; justify-content:center; font-size:30px }
</style>
</head>
<body>

<div class="wrap">
  <div class="top"><h1>Design a Buffalo House</h1><p>Part 2: Model It, step by step</p></div>
  <div class="frame" id="frame"><div id="stage"></div></div>
  <div class="bar">
    <span class="count" id="count">Step 1 of 1</span>
    <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
    <div class="btns">
      <button type="button" id="back">Back</button>
      <button type="button" id="replay">Replay step</button>
      <button type="button" id="next" class="primary">Next</button>
    </div>
  </div>
  <p class="hint">Click Next to see each step. You can also use the arrow keys.</p>
</div>
<script>
(function () {
  const stage = document.getElementById('stage');
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const base = {
    seg: (t, a, b) => clamp01((t - a) / (b - a)),
    lerp: (a, b, p) => a + (b - a) * p,
    clamp01,
    eo: (x) => 1 - Math.pow(1 - clamp01(x), 3),
    ei: (x) => Math.pow(clamp01(x), 3),
    eio: (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
    eob: (x, s) => { x = clamp01(x); const c1 = s === undefined ? 1.70158 : s, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  };
  const SCENES = {};
  window.makeKit = function (id) {
    const el = document.createElement('div');
    el.className = 'scene'; el.hidden = true; stage.appendChild(el);
    return Object.assign({}, base, {
      stage: el, W: 1920, H: 1080,
      h(html) { const tp = document.createElement('template'); tp.innerHTML = html.trim(); return tp.content.children.length === 1 ? tp.content.firstElementChild : tp.content; },
      css(text) { const s = document.createElement('style'); s.textContent = text; el.appendChild(s); },
      scene(sid, def) { SCENES[sid] = { def, el, kit: this }; },
    });
  };
  window.__SCENES = SCENES;
})();
</script>
<script>
// The worksheet's Side View of a Buffalo House. 1 ft = 70 px. The wall is at x 850, the ground at y 900, the overhang dot at (850, 340).
window.W = {
  ease(p) { p = Math.min(1, Math.max(0, p)); return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; },
  cl(p) { return Math.min(1, Math.max(0, p)); },
  // Where a noon sunlight line from the tip of an L ft overhang meets the wall (or the ground first).
  hit(L, deg) {
    const tx = 850 - 70 * L, ty = 340, tn = Math.tan(deg * Math.PI / 180);
    let ex = 850, ey = ty + 70 * L * tn, ground = false;
    if (ey > 900) { ey = 900; ex = tx + 560 / tn; ground = true; }
    return { tx, ty, ex, ey, ground };
  },
  lab(text, x, y, cls, style) {
    return '<div class="lab ' + (cls || 'c') + '" style="left:' + x + 'px;top:' + y + 'px' + (style ? ';' + style : '') + '">' + text + '</div>';
  },
  // Graph paper: 0.5 ft squares, heavier line every foot.
  paper() {
    let s = '<rect x="150" y="200" width="700" height="700" style="fill:var(--ground)"/>';
    for (let i = 0; i <= 20; i++) {
      const v = 150 + 35 * i, h = 200 + 35 * i, maj = i % 2 === 0, st = 'stroke:var(' + (maj ? '--gridM' : '--gridm') + ');stroke-width:' + (maj ? 1.7 : 1);
      s += '<path d="M' + v + ' 200V900" style="' + st + '"/><path d="M150 ' + h + 'H850" style="' + st + '"/>';
    }
    return s;
  },
  house() {
    let s = '<g class="dg-ground"><rect x="110" y="900" width="1130" height="42" style="fill:var(--grass)"/>';
    for (let x = 160; x < 840; x += 35) s += '<path d="M' + x + ' 900 l7 -13 l7 13" style="fill:none;stroke:var(--grassD);stroke-width:2"/>';
    s += '</g><g class="dg-sun"><circle cx="220" cy="270" r="27" style="fill:var(--accent);stroke:var(--sunE);stroke-width:2.5"/></g>';
    s += '<g class="dg-house"><rect x="1118" y="150" width="34" height="150" style="fill:var(--roofL);stroke:var(--second);stroke-width:3"/>';
    s += '<rect x="850" y="340" width="350" height="560" style="fill:var(--wallc);stroke:var(--second);stroke-width:5"/>';
    for (let y = 380; y < 900; y += 40) s += '<path d="M853 ' + y + 'H1197" style="stroke:var(--siding);stroke-width:2"/>';
    s += '<path d="M842 342 L1025 186 L1208 342 Z" style="fill:var(--roof);stroke:var(--second);stroke-width:4;stroke-linejoin:round"/>';
    [300, 262, 224].forEach((y) => { const hw = (y - 186) / 156 * 183; s += '<path d="M' + (1025 - hw + 8).toFixed(0) + ' ' + y + 'H' + (1025 + hw - 8).toFixed(0) + '" style="stroke:var(--roofL);stroke-width:2"/>'; });
    s += '<rect class="dg-window" x="840" y="410" width="18" height="280" rx="2" style="fill:var(--glass);stroke:var(--second);stroke-width:3"/>';
    s += '<path d="M712 262 Q790 280 838 332" style="fill:none;stroke:var(--second);stroke-width:2"/><path d="M826 330 L840 336 L834 322" style="fill:none;stroke:var(--second);stroke-width:2"/>';
    s += '<circle class="dg-dot" cx="850" cy="340" r="8" style="fill:var(--second)"/></g>';
    return s;
  },
  labels() {
    let s = '';
    for (let i = 0; i <= 10; i++) s += W.lab(String(i), 132, 900 - 70 * i, 'r', 'background:none');
    s += W.lab('Noon Sun (to the south)', 160, 330, 'l', 'max-width:260px');
    s += W.lab('Overhang starts here (top of wall, 8 ft)', 640, 236, 'c', 'max-width:330px;text-align:center');
    s += W.lab('Window (3 ft to 7 ft)', 872, 520, 'l', 'max-width:250px;background:none');
    s += W.lab('Inside the house', 1025, 730, 'c', 'max-width:300px;text-align:center;background:none');
    s += W.lab('← SOUTH', 200, 975, 'c', 'font-weight:700;background:none');
    s += W.lab('NORTH →', 1150, 975, 'c', 'font-weight:700;background:none');
    s += W.lab('Side view. 1 small square = 0.5 ft (2 squares = 1 ft)', 675, 1032, 'c', 'max-width:900px;background:none');
    return s;
  },
  // The whole diagram. o.under / o.over: svg markup below / above the house; o.html: labels and tags in diagram px.
  diagram(id, o) {
    o = o || {};
    return '<div class="dg-clip"><div class="dg ' + id + '-dg"><svg class="dg-svg" viewBox="0 0 1240 1080" width="1240" height="1080">' +
      W.paper() + (o.under || '') + W.house() + (o.over || '') + '</svg>' + W.labels() + (o.html || '') + '</div></div>';
  },
  // Camera on the diagram: keys [{x, y, z}, {t, d, x, y, z}, ...]. (x, y) is the diagram point shown at the middle of the left area.
  cam(dg, t, keys, creep) {
    let x = keys[0].x, y = keys[0].y, z = keys[0].z;
    for (let i = 1; i < keys.length; i++) {
      const k = keys[i], p = W.ease((t - k.t) / (k.d || 1.4));
      x += (k.x - x) * p; y += (k.y - y) * p; z += (k.z - z) * p;
    }
    z *= 1 + (creep === undefined ? 0.0012 : creep) * Math.max(0, t);
    dg.style.transform = 'translate(' + (620 - x * z).toFixed(2) + 'px,' + (540 - y * z).toFixed(2) + 'px) scale(' + z.toFixed(4) + ')';
    dg.style.setProperty('--k', (1 / z).toFixed(4));
  },
  // A line drawn from (x1,y1) toward (x2,y2), p of the way.
  draw(el, x1, y1, x2, y2, p) {
    p = W.cl(p);
    el.setAttribute('x1', x1); el.setAttribute('y1', y1);
    el.setAttribute('x2', (x1 + (x2 - x1) * p).toFixed(2)); el.setAttribute('y2', (y1 + (y2 - y1) * p).toFixed(2));
    el.style.opacity = p > 0 ? 1 : 0;
  },
  // The protractor: centered on (0,0), flat edge level, curve below, 0 degrees pointing right (toward the wall).
  prot(cls, R) {
    let s = '<g class="' + cls + '"><path d="M' + (-R) + ' 0 A' + R + ' ' + R + ' 0 0 0 ' + R + ' 0 Z" style="fill:color-mix(in srgb, var(--main) 10%, transparent);stroke:var(--main);stroke-width:2.5"/>';
    s += '<path d="M' + (-R * 0.58) + ' 0 A' + (R * 0.58) + ' ' + (R * 0.58) + ' 0 0 0 ' + (R * 0.58) + ' 0" style="fill:none;stroke:color-mix(in srgb, var(--main) 40%, transparent);stroke-width:1.4"/>';
    for (let a = 0; a <= 180; a += 5) {
      const r = a * Math.PI / 180, c = Math.cos(r), sn = Math.sin(r), len = a % 10 ? 0.07 : (a % 30 ? 0.12 : 0.19);
      s += '<path d="M' + (R * c).toFixed(1) + ' ' + (R * sn).toFixed(1) + ' L' + (R * (1 - len) * c).toFixed(1) + ' ' + (R * (1 - len) * sn).toFixed(1) + '" style="stroke:var(--main);stroke-width:' + (a % 10 ? 1.1 : 2) + '"/>';
    }
    return s + '<path d="M' + (-R * 1.1) + ' 0 H' + (R * 1.1) + '" style="stroke:var(--main);stroke-width:3"/><circle r="4" style="fill:var(--ground);stroke:var(--main);stroke-width:2"/></g>';
  },
  // The measured angle, from level (pointing right) down to deg.
  arc(r, deg) {
    const a = deg * Math.PI / 180;
    return 'M' + r + ' 0 A' + r + ' ' + r + ' 0 0 1 ' + (r * Math.cos(a)).toFixed(2) + ' ' + (r * Math.sin(a)).toFixed(2);
  },
  // Finished overhangs and their lines: [{L, col:'--pencil', degs:[71,24], o}]
  done(list) {
    return list.map((m) => {
      let s = '<g class="dg-mark" style="opacity:' + (m.o || 1) + '">';
      m.degs.forEach((d) => {
        const h = W.hit(m.L, d);
        s += '<path d="M' + h.tx + ' ' + h.ty + ' L' + h.ex.toFixed(1) + ' ' + h.ey.toFixed(1) + '" style="stroke:var(' + m.col + ');stroke-width:4;stroke-linecap:round"/><circle cx="' + h.ex.toFixed(1) + '" cy="' + h.ey.toFixed(1) + '" r="6" style="fill:var(' + m.col + ')"/>';
      });
      return s + '<path d="M850 340 H' + (850 - 70 * m.L) + '" style="stroke:var(' + m.col + ');stroke-width:7;stroke-linecap:round"/></g>';
    }).join('');
  },
  // Window light for a line that meets the wall at ey: sunny below it, shaded above it (window runs y 410 to 690).
  light(sun, shade, ey, p) {
    const y = Math.min(690, Math.max(410, ey));
    sun.setAttribute('y', y); sun.setAttribute('height', 690 - y);
    shade.setAttribute('y', 410); shade.setAttribute('height', y - 410);
    sun.style.opacity = p; shade.style.opacity = p;
  },
  lightSvg(cls) {
    return '<rect class="' + cls + '-sun" x="838" width="22" y="410" height="0" style="fill:var(--sunW);opacity:0"/><rect class="' + cls + '-shade" x="838" width="22" y="410" height="0" style="fill:var(--shadeW);opacity:0"/>';
  },
  // An expanding ring that calls the eye to a point.
  pulse(el, t, t0, r0) {
    if (t < t0) { el.style.opacity = 0; return; }
    const q = ((t - t0) % 1.3) / 1.3;
    el.setAttribute('r', (r0 + 34 * q).toFixed(1));
    el.style.opacity = ((1 - q) * 0.85).toFixed(3);
  },
  ring(cls, x, y, col) {
    return '<circle class="' + cls + '" cx="' + x + '" cy="' + y + '" r="10" style="fill:none;stroke:var(' + (col || '--main') + ');stroke-width:4;opacity:0"/>';
  },
  // The instruction panel on the right. steps cross-fade in one spot.
  panel(eye, chip, head, steps) {
    return '<div class="pn"><div class="words pn-w"><div class="pn-eye"><span class="pn-chip pn-' + chip + '"></span>' + eye + '</div><h2 class="line pn-h">' + head + '</h2><div class="pn-steps">' +
      steps.map((s) => '<p class="pn-s">' + s + '</p>').join('') + '</div></div>' + W.key() + '</div>';
  },
  // The color key, at the foot of the panel.
  key() {
    return '<div class="pn-key"><p class="pn-key-h">Key</p>' +
      '<p class="pn-key-i"><span class="pn-key-sw pn-pencil"></span>Gray = 1 ft overhang (pencil)</p>' +
      '<p class="pn-key-i"><span class="pn-key-sw pn-blue"></span>Blue = 3 ft overhang (colored pencil 1)</p>' +
      '<p class="pn-key-i"><span class="pn-key-sw pn-green"></span>Green = 2 ft design (colored pencil 2)</p></div>';
  },
  steps(els, t, times) {
    els.forEach((el, i) => {
      const a = times[i], b = i + 1 < times.length ? times[i + 1] : 1e9;
      const inn = W.ease((t - a) / 0.5), out = W.cl((t - (b - 0.45)) / 0.45);
      el.style.opacity = (inn * (1 - out)).toFixed(3);
      el.style.transform = 'translateY(' + ((1 - inn) * 22 - out * 12).toFixed(1) + 'px)';
    });
  },
  head(el, t) {
    const p = W.ease((t + 0.5) / 0.6);
    el.style.opacity = p; el.style.transform = 'translateY(' + ((1 - p) * 20).toFixed(1) + 'px)';
  },
};
</script>
<script>
(function (kit) {
const { seg, eo } = kit;
kit.scene('title', {
  init(kit) {
    kit.stage.append(kit.h('<div class="ground">' +
      W.diagram('title', { over: W.ring('title-win', 849, 550, '--accent') }) +
      W.panel('Part 2: Model It', 'sun', 'Design a Buffalo House', ['Your goal: In June, no direct sunlight hits the window. In December, sunlight hits the whole window.']) +
      '</div>'));
    const q = (s) => kit.stage.querySelector(s);
    this.dg = q('.title-dg');
    this.sun = q('.dg-sun');
    this.win = q('.title-win');
    this.head = q('.pn-w');
    this.steps = [...kit.stage.querySelectorAll('.pn-s')];
  },
  render(t) {
    W.cam(this.dg, t, [{ x: 640, y: 560, z: 0.97 }], 0.003);
    const b = 1 + 0.03 * Math.sin(t * 2.1);
    this.sun.setAttribute('transform', 'translate(220 270) scale(' + b.toFixed(4) + ') translate(-220 -270)');

    this.deg.style.opacity = (eo(seg(t, 4.5, 4.9)) * (1 - out)).toFixed(3);
    this.mark.style.opacity = W.cl(eob(seg(t, 5.0, 5.4), 1.6)) * (1 - seg(t, 9.0, 9.5));
    const d = W.ease(seg(t, 7.4, 8.8));
    W.draw(this.line, 710, 340, M.ex, M.ey, d);
    W.hold(this.pen, lerp(710, M.ex, d), lerp(340, M.ey, d), seg(t, 7.0, 7.4) * (1 - seg(t, 9.0, 9.4)), t);
    this.end.style.opacity = W.cl(eob(seg(t, 8.8, 9.2), 1.6));
    W.pulse(this.endr, t, 9.2, 8);
    this.tag.style.opacity = eo(seg(t, 8.9, 9.4));
    W.light(this.sun, this.shade, M.ey, eo(seg(t, 9.8, 10.6)) * (0.85 + 0.15 * Math.sin(t * 2)));
    this.sh.style.opacity = eo(seg(t, 10.5, 11.0));
    this.su.style.opacity = eo(seg(t, 10.8, 11.3));

    W.steps(this.steps, t, [-0.6, 7]);

})(makeKit("march"));
(function (kit) {
const { seg, eo } = kit;
Object.assign(W, {
  // Every finished line: 1 ft (pencil), 3 ft (color 1), the 2 ft design (color 2) and its dashed March line.
  allLines() {
    const m = W.hit(2, 47);
    return W.done([{ L: 1, col: '--pencil', degs: [71, 24] }, { L: 3, col: '--main', degs: [71, 24] }, { L: 2, col: '--green', degs: [71, 24] }]) +

  },
});
kit.scene('recap', {
  init(kit) {
    const over = W.allLines();
    const html = '';
    kit.stage.append(kit.h('<div class="ground">' + W.diagram('recap', { over, html }) +
      '<div class="pn"><div class="words pn-w"><div class="pn-eye"><span class="pn-chip pn-sun"></span>Recap</div>' +
      '<h2 class="line pn-h">The same 4 steps for every line</h2><div class="pn-list">' +
      '<p class="pn-li recap-li"><span class="pn-n">1</span><span>Draw the overhang from the dot (2 squares = 1 ft).</span></p>' +
      '<p class="pn-li recap-li"><span class="pn-n">2</span><span>Put the protractor center on the tip, flat edge level.</span></p>' +
      '<p class="pn-li recap-li"><span class="pn-n">3</span><span>Measure the angle down from level and draw the line to the wall.</span></p>' +

  },
  render(t) {

    W.head(this.head, t);
    this.items.forEach((el, i) => {
      const p = W.ease(seg(t, 0.5 + 0.9 * i, 1.0 + 0.9 * i));
      el.style.opacity = p.toFixed(3);
      el.style.transform = 'translateX(' + ((1 - p) * 28).toFixed(1) + 'px)';
    });
  },
});
})(makeKit("recap"));
(function (kit) {
const { seg, eo } = kit;
kit.scene('final', {
  init(kit) {
    kit.css('.final-li { align-items:center } .final-sw { flex:none; width:56px; height:10px; border-radius:5px } .final-dash { background:repeating-linear-gradient(90deg, var(--green) 0 14px, transparent 14px 22px) } .final-note { font-size:30px; line-height:1.4; margin:0; color:var(--second) } .final-pause { font-size:30px; font-weight:700; color:var(--main); margin:0 }');

      '<div class="pn"><div class="words pn-w" style="top:90px"><div class="pn-eye"><span class="pn-chip pn-sun"></span>Your final model</div>' +
      '<h2 class="line pn-h">Use this picture to fill in your sheet</h2><div class="pn-list" style="gap:16px">' +
      '<p class="pn-li final-li final-it"><span class="final-sw pn-pencil"></span><span>1 ft overhang (pencil)</span></p>' +

    this.dg = kit.stage.querySelector('.final-dg');

    this.items.forEach((el, i) => {

</script>
<script>
(function () {
  const STEPS = [["title", 0, 4.2], ["tour", 0, 3.5], ["tour", 5, 8.2], ["tour", 10, 13.5], ["tour", 15, 19], ["one-over", 0, 3.4], ["one-over", 4.6, 8.4], ["one-june", 0, 3.2], ["one-june", 6, 10.6], ["one-june", 12, 15.5], ["one-check", 0, 4.0], ["one-check", 6, 9.0], ["one-dec", 0, 7.2], ["one-dec", 7, 10.2], ["three", 0, 6.4], ["three", 6.5, 13.3], ["three", 13.5, 15.0], ["three", 19, 25.6], ["design", 0, 5.6], ["design", 6.5, 13.4], ["design", 13.5, 15.6], ["design", 19, 24.2], ["design", 24.4, 26.5], ["march", 0, 5.6], ["march", 7, 11.4], ["recap", 0, 4.0], ["final", 0, 4.2]];
  const frame = document.getElementById('frame'), stage = document.getElementById('stage');
  const els = { count: document.getElementById('count'), fill: document.getElementById('fill'), back: document.getElementById('back'), next: document.getElementById('next'), replay: document.getElementById('replay') };
  function fit() { stage.style.transform = 'scale(' + (frame.clientWidth / 1920) + ')'; }
  try { new ResizeObserver(fit).observe(frame); } catch (e) { window.addEventListener('resize', fit); }
  fit();
  let cur = 0, playing = false, t0 = 0, raf = 0, shown = null;
  function show(sid, t) {
    const S = SC[sid];
    if (shown !== sid) { Object.values(SC).forEach((s) => { s.el.hidden = true; }); S.el.hidden = false; shown = sid; }
    try { S.def.render.call(S.def, t, S.kit); } catch (e) { console.error(e); }
  }
  function ui() {
    els.count.textContent = 'Step ' + (cur + 1) + ' of ' + STEPS.length;
    els.fill.style.width = ((cur + 1) / STEPS.length * 100).toFixed(1) + '%';
    els.back.disabled = cur === 0;
    els.next.disabled = cur === STEPS.length - 1 && !playing;
    els.next.textContent = cur === STEPS.length - 1 && !playing ? 'Done' : 'Next';
  }
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function play(i) {
    cur = i; const [sid, a, b] = STEPS[i];
    cancelAnimationFrame(raf);
    if (reduce) { playing = false; show(sid, b); ui(); return; }
    playing = true; t0 = performance.now(); ui();
    const tick = (now) => {
      const t = a + (now - t0) / 1000;
      if (t >= b) { show(sid, b); playing = false; ui(); return; }
      show(sid, t); raf = requestAnimationFrame(tick);
    };
    show(sid, a); raf = requestAnimationFrame(tick);
  }
  function finish() { cancelAnimationFrame(raf); playing = false; const [sid, , b] = STEPS[cur]; show(sid, b); ui(); }
  function hold(i) { cancelAnimationFrame(raf); playing = false; cur = i; const [sid, , b] = STEPS[i]; show(sid, b); ui(); }
  function next() { if (playing) { finish(); return; } if (cur < STEPS.length - 1) play(cur + 1); }
  function back() { if (cur > 0) hold(cur - 1); else hold(0); }
  els.next.addEventListener('click', next);
  els.back.addEventListener('click', back);
  els.replay.addEventListener('click', () => play(cur));
  document.addEventListener('keydown', (e) => {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); back(); }
  });
  let SC = {};
  (async () => {
    SC = window.__SCENES;
    for (const id of Object.keys(SC)) { const s = SC[id]; if (s.def.init) await s.def.init.call(s.def, s.kit); }
    hold(0);
  })();
})();
</script>
