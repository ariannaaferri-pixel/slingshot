document.getElementById('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pb.click();}});
function loop(now){if(playing){const nT=T+(now-last)/1000;const end=CH.find(c=>T<c.b&&nT>=c.b&&c.b<TOTAL);
  if(end){T=end.b-0.001;hold=end.b;setPlay(false);}else{T=nT;if(T>=TOTAL){T=TOTAL-0.001;setPlay(false);}}}
 last=now;draw(T);sr.value=T;tm.textContent=T.toFixed(1)+' s';requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
