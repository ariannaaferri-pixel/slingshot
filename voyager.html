<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voyager 1 Light-Day</title>
<style>
html,body{margin:0;height:100%;background:#070c18;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#E8EEF5}
#c{position:absolute;left:0;top:0;width:100%;height:calc(100% - 64px);display:block}
#bar{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#0B1424;border-top:1px solid #1d3550;box-sizing:border-box}
#bar button{background:#3FA7D6;color:#0B1424;border:0;border-radius:6px;font:bold 15px Arial,sans-serif;padding:9px 14px;cursor:pointer;min-width:76px}
#bar button.alt{background:transparent;color:#E8EEF5;border:1px solid #3FA7D6}
#chap{display:flex;gap:6px}
#chap button{min-width:0;padding:8px 10px;font-size:13px;background:transparent;color:#c9d6e3;border:1px solid #2b4a6b}
#chap button.on{background:#F2A541;color:#0B1424;border-color:#F2A541}
#scrub{flex:1;min-width:60px;accent-color:#F2A541}
#time{font:14px monospace;min-width:58px;text-align:right}
@media (max-width:900px){#chap button{font-size:11px;padding:6px 6px}#fs{display:none}}
@media (max-width:700px){#chap,#snd{display:none}}
#photo{position:absolute;right:16px;top:16px;width:min(360px,40vw);background:rgba(11,20,36,0.95);border:1px solid #3FA7D6;border-radius:10px;padding:10px;box-sizing:border-box;opacity:0;transform:translateY(-8px);transition:opacity .4s,transform .4s;pointer-events:none;cursor:zoom-in}
#photo.on{opacity:1;transform:none;pointer-events:auto}
#photo .tag{font:bold 12px Arial;color:#F2A541;letter-spacing:.04em;margin-bottom:6px}
#photo img{display:block;width:100%;height:auto;max-height:36vh;object-fit:contain;border-radius:6px;background:#000}
#photo h3{margin:8px 0 4px;font-size:17px}
#photo p{margin:0;font-size:14px;line-height:1.35;color:#c9d6e3}
#photo .cr{margin-top:6px;font-size:11px;color:#8fb3d1}
#big{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;box-sizing:border-box;z-index:5;cursor:zoom-out}
#big.on{display:flex}#big img{max-width:100%;max-height:80vh;border-radius:6px}#big p{max-width:900px;text-align:center;font-size:17px;line-height:1.4;color:#E8EEF5}
#pred{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.96);width:min(760px,92vw);background:rgba(11,20,36,0.97);border:2px solid #F2A541;border-radius:14px;padding:26px 30px;box-sizing:border-box;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;z-index:4;box-shadow:0 0 60px rgba(242,165,65,0.25)}
#pred.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#pred .tag{font:bold 14px Arial;color:#F2A541;letter-spacing:.08em}
#pred h2{font-size:clamp(20px,3vw,30px);line-height:1.25;margin:10px 0 18px}
#pred .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
#pred .opts button{background:#13233b;color:#E8EEF5;border:1px solid #2b4a6b;border-radius:8px;padding:14px;font:bold clamp(15px,2vw,20px) Arial;text-align:left;cursor:pointer}
#pred .opts button.pick{background:#F2A541;color:#0B1424;border-color:#F2A541}
#go{background:#3FA7D6;color:#0B1424;border:0;border-radius:8px;font:bold 18px Arial;padding:12px 22px;cursor:pointer}
#gal{position:absolute;display:none;color:#3FA7D6;font:bold 16px Arial;text-decoration:underline}

  const l=AC.createOscillator();l.frequency.value=0.05+i*0.031;const lg=AC.createGain();lg.gain.value=0.3;l.connect(lg);lg.connect(g.gain);l.start();});}
function tone(fq,dur=0.6,vol=0.12,type='sine',when=0){if(!AC||!soundOn)return;const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=fq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);}
const chime=()=>[523.25,659.25,783.99,1046.5].forEach((fq,i)=>tone(fq,1.8,0.06,'sine',i*0.1));
const ping=()=>{tone(880,0.5,0.07);tone(1318.5,0.7,0.04,'sine',0.08);};
const beep=()=>{tone(1200,0.1,0.05,'square');tone(1200,0.1,0.05,'square',0.16);tone(1600,0.14,0.05,'square',0.32);};
const tick=()=>tone(1568,0.25,0.05);
function whoosh(d){if(!AC||!soundOn)return;const n=Math.floor(AC.sampleRate*d),bf=AC.createBuffer(1,n,AC.sampleRate),ch=bf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
 const src=AC.createBufferSource();src.buffer=bf;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.Q.value=0.9;const t=AC.currentTime;fl.frequency.setValueAtTime(2200,t);fl.frequency.exponentialRampToValueAtTime(140,t+d);
 const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.16,t+d*0.35);g.gain.linearRampToValueAtTime(0,t+d);src.connect(fl);fl.connect(g);g.connect(master);src.start(t);src.stop(t+d);}
const CUES=[[17,chime],[CH[1].a+21,chime],[CH[2].a+2,beep],[CH[2].a+10,ping],[CH[2].a+12,beep],[CH[2].a+20,ping],[CH[3].a+3,tick],[CH[3].a+14,chime],[CH[5].a+0.2,chime]];
LT.forEach(l=>CUES.push([CH[1].a+3+l[1]*0.138617/24*18,tick]));
ZOOMS.forEach((z,i)=>CUES.push([CH[4].a+z,()=>whoosh(ZK.find(q=>q[0]>z)[0]-z+0.4)]));

 2:{q:'You send Voyager 1 a message. How long until its answer gets back to you?',o:['A few seconds','A few hours','2 days','2 months']},
 3:{q:'Light makes the trip from Earth to Voyager 1 in 1 day. How long did Voyager 1 take?',o:['1 month','1 year','10 years','49 years']},
 4:{q:'Voyager 1 is the farthest thing we have ever sent. How much of the way to the nearest star has it gone?',o:['About half','About 1/10','Less than 1/1,000']}};
const prEl=document.getElementById('pred');let predOpen=false;

 p.o.forEach((o,i)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'.  '+o;b.onclick=()=>{box.querySelectorAll('button').forEach(x=>x.classList.remove('pick'));b.classList.add('pick');tick();};box.appendChild(b);});
 prEl.classList.add('on');predOpen=true;ping();return true;}

const chapEl=document.getElementById('chap'),chBtns=CH.map((c,j)=>{const b=document.createElement('button');b.textContent=c.n;b.onclick=()=>{T=c.a;hold=-1;hidePred();if(showPred(j))setPlay(false);else setPlay(true);};chapEl.appendChild(b);return b;});
fit();let T=0,playing=true,last=performance.now(),hold=-1;

pb.onclick=()=>{hidePred();if(!playing&&T>=TOTAL-0.01)T=0;if(!playing&&hold>=0){T=hold;hold=-1;}setPlay(!playing);};

const phEl=document.getElementById('photo'),bigEl=document.getElementById('big'),galEl=document.getElementById('gal');let phNow=-1;
function showPhoto(t){const i=PHOTOS.findIndex(p=>t>=p.a&&t<p.b);if(i===phNow)return;phNow=i;
 if(i<0){phEl.classList.remove('on');return;}const ph=PHOTOS[i],im=phEl.querySelector('img');let n=0;if(playing)ping();
 phEl.querySelector('.tag').textContent=ph.a>=CH[5].a?'PHOTO FROM NASA':'PHOTO TAKEN BY VOYAGER 1';
 im.style.display='';im.onerror=()=>{n++;if(n<ph.src.length){im.src=ph.src[n];return;}im.style.display='none';phEl.querySelector('.cap').textContent=ph.c+' (Photo did not load. Search “'+ph.id+'” at photojournal.jpl.nasa.gov.)';};im.src=ph.src[0];im.alt=ph.t;
 phEl.querySelector('h3').textContent=ph.t;phEl.querySelector('.cap').textContent=ph.c;phEl.querySelector('.cr').textContent='NASA/JPL-Caltech · '+ph.id+' · click to enlarge';phEl.classList.add('on');}
phEl.onclick=()=>{if(phNow<0)return;const ph=PHOTOS[phNow];bigEl.querySelector('img').src=phEl.querySelector('img').src;bigEl.querySelector('p').textContent=ph.t+': '+ph.c+' (NASA/JPL-Caltech)';bigEl.classList.add('on');setPlay(false);};

function showLink(t){const on=t>=CH[5].a+15&&t<CH[5].a+28;galEl.style.display=on?'block':'none';if(on){galEl.style.left=(ox+826*f)+'px';galEl.style.top=(oy+732*f)+'px';galEl.style.fontSize=Math.max(12,18*f)+'px';}}
function loop(now){showPhoto(T);showLink(T);if(playing){const ph=PHOTOS.find(p=>T>=p.a&&T<p.b);const nT=T+(now-last)/1000*(ph?(ph.b-ph.a)/6.5:1);const end=CH.find(c=>T<c.b&&nT>=c.b&&c.b<TOTAL);
  CUES.forEach(c=>{if(T<c[0]&&Math.min(nT,end?end.b:nT)>=c[0])c[1]();});
  if(end){T=end.b-0.001;hold=end.b;setPlay(false);showPred(CH.indexOf(end)+1);}else{T=nT;if(T>=TOTAL){T=TOTAL-0.001;setPlay(false);}}}
 last=now;draw(T);sr.value=T;tm.textContent=T.toFixed(1)+' s';requestAnimationFrame(loop);}
